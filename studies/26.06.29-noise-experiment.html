<!-- 26.06.29: Making wind sound with Tone.js. How does the sound differ with each parameter change? -->
<!DOCTYPE html>
<html>
<head>
    <title>Tone.js 소리 실험실 v2.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e2e8f0; padding: 20px; }
        .control-group { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        input[type=range] { width: 100%; cursor: pointer; }
        .val { font-weight: bold; color: #fef08a; }
    </style>
</head>
<body>
    <h2>🎛️ 바람/빗소리 합성 실험실</h2>
    <button id="btn" style="padding: 10px 20px; cursor: pointer;">재생 시작</button>

    <div class="control-group">
        <label>볼륨: <span id="vVal" class="val">-20</span>dB</label>
        <input type="range" id="vol" min="-60" max="0" value="-20">
    </div>

    <div class="control-group">
        <label>필터 기본 컷오프: <span id="fVal" class="val">500</span>Hz</label>
        <input type="range" id="freq" min="20" max="5000" value="500">
    </div>

    <div class="control-group">
        <label>LFO 속도 (얼마나 빨리 흔들지): <span id="lfoSVal" class="val">0.1</span>Hz</label>
        <input type="range" id="lfoSpeed" min="0.01" max="10" step="0.01" value="0.1">
        
        <label>LFO 범위 (흔들리는 폭): <span id="lfoRVal" class="val">200</span>Hz</label>
        <input type="range" id="lfoRange" min="0" max="2000" value="200">
    </div>

    <script>
        let noise, filter, lfo;
        const btn = document.getElementById('btn');

        btn.addEventListener('click', async () => {
            await Tone.start();
            if(!noise) {
                noise = new Tone.Noise("white").start();
                filter = new Tone.Filter(500, "lowpass").toDestination();
                lfo = new Tone.LFO(0.1, 400, 600).connect(filter.frequency).start();
                noise.connect(filter);
                noise.volume.value = -20;
            }
            btn.innerText = "작동 중...";
        });

        // 이벤트 리스너들
        document.getElementById('vol').addEventListener('input', e => {
            noise.volume.value = e.target.value;
            document.getElementById('vVal').innerText = e.target.value;
        });
        document.getElementById('freq').addEventListener('input', e => {
            filter.frequency.value = e.target.value;
            document.getElementById('fVal').innerText = e.target.value;
        });
        document.getElementById('lfoSpeed').addEventListener('input', e => {
            lfo.frequency.value = e.target.value;
            document.getElementById('lfoSVal').innerText = e.target.value;
        });
        document.getElementById('lfoRange').addEventListener('input', e => {
            const center = parseInt(filter.frequency.value);
            const range = parseInt(e.target.value);
            lfo.min = Math.max(20, center - range);
            lfo.max = center + range;
            document.getElementById('lfoRVal').innerText = e.target.value;
        });
    </script>
</body>
</html>
